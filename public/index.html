<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--SEO_HEAD-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/blog.css" />
</head>
<body>
  <canvas id="particle-canvas" class="particle-canvas"></canvas>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <div class="floating-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
    <div class="shape shape-6"></div>
    <div class="shape shape-bracket shape-bracket-1">{</div>
    <div class="shape shape-bracket shape-bracket-2">}</div>
    <div class="shape shape-code">&lt;/&gt;</div>
  </div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo" id="nav-logo"></a>
      <div class="nav-links" id="nav-links"></div>
      <span class="nav-status" id="nav-status">
        <span class="status-dot"></span>
      </span>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-content">
          <div class="hero-badge">
            <span class="hero-badge-dot"></span>
            <span id="hero-greeting"></span>
          </div>
          <h1 class="hero-title">
            <span id="hero-name"></span>
            <span class="hero-cursor">_</span>
          </h1>
          <p class="hero-role" id="hero-title"></p>
          <p class="hero-tagline" id="hero-tagline"></p>
          <p class="hero-bio" id="hero-bio"></p>
          <p class="hero-location" id="hero-location"></p>
          <div class="hero-actions">
            <a href="#contact" class="btn btn-primary" id="hero-btn-primary"></a>
            <a href="#projects" class="btn btn-ghost" id="hero-btn-secondary"></a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="photo-wrapper">
            <div class="orbit orbit-1"><span></span></div>
            <div class="orbit orbit-2"><span></span></div>
            <div class="orbit orbit-3"><span></span></div>
            <div class="photo-ring"></div>
            <div class="photo-frame">
              <img id="hero-photo" src="" alt="" class="hero-photo" />
            </div>
            <div class="photo-scanline"></div>
            <div class="hero-photo-thumbs" id="hero-photo-thumbs" title="Switch Hero Photo"></div>
          </div>
          <div class="stats-panel">
            <div class="stats-grid" id="stats-grid"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section reveal" id="experience">
      <div class="section-inner">
        <div class="section-header">
          <span class="section-num">01</span>
          <div>
            <span class="section-label" id="exp-label"></span>
            <h2 id="exp-title"></h2>
          </div>
        </div>
        <div class="timeline" id="experience-list"></div>
      </div>
    </section>

    <section class="section section-alt reveal" id="projects">
      <div class="section-inner">
        <div class="section-header">
          <span class="section-num">02</span>
          <div>
            <span class="section-label" id="proj-label"></span>
            <h2 id="proj-title"></h2>
          </div>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <section class="section reveal" id="research">
      <div class="section-inner">
        <div class="section-header">
          <span class="section-num">03</span>
          <div>
            <span class="section-label" id="research-label"></span>
            <h2 id="research-title"></h2>
          </div>
        </div>
        <div class="research-grid" id="research-grid"></div>
      </div>
    </section>

    <section class="section section-alt reveal" id="tutorials">
      <div class="section-inner">
        <div class="section-header">
          <span class="section-num">04</span>
          <div>
            <span class="section-label" id="tutorials-label"></span>
            <h2 id="tutorials-title"></h2>
          </div>
        </div>
        <div class="tutorials-grid" id="tutorials-grid"></div>
      </div>
    </section>

    <section class="section reveal" id="skills">
      <div class="section-inner">
        <div class="section-header">
          <span class="section-num">05</span>
          <div>
            <span class="section-label" id="skills-label"></span>
            <h2 id="skills-title"></h2>
          </div>
        </div>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <section class="section section-alt reveal" id="gallery">
      <div class="section-inner">
        <div class="section-header">
          <span class="section-num">06</span>
          <div>
            <span class="section-label" id="gallery-label"></span>
            <h2 id="gallery-title"></h2>
          </div>
        </div>
        <div class="gallery-filters" id="gallery-filters"></div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <section class="section reveal" id="blog">
      <div class="section-inner">
        <div class="section-header">
          <span class="section-num">07</span>
          <div>
            <span class="section-label" id="blog-label"></span>
            <h2 id="blog-title"></h2>
          </div>
        </div>
        <p class="section-desc" id="blog-desc"></p>
        <div class="blog-preview-grid" id="blog-preview-grid"></div>
        <div class="blog-preview-action">
          <a href="/blog" class="btn btn-primary" id="blog-view-all"></a>
        </div>
      </div>
    </section>

    <section class="section contact-section reveal" id="contact">
      <div class="section-inner">
        <div class="contact-card">
          <div class="contact-glow"></div>
          <span class="section-label contact-label">Contact</span>
          <h2 id="contact-headline"></h2>
          <p id="contact-subtext"></p>
          <div class="contact-meta">
            <span class="contact-badge" id="contact-response"></span>
            <a href="#" class="btn btn-primary" id="contact-email"></a>
          </div>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p><span id="footer-text"></span> · <a href="/admin.html" id="footer-admin"></a></p>
  </footer>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox-modal" aria-hidden="true">
    <div class="lightbox-overlay" id="lightbox-overlay"></div>
    <div class="lightbox-content">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close modal">&times;</button>
      <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#10094;</button>
      <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">&#10095;</button>
      <div class="lightbox-media-wrapper">
        <img id="lightbox-img" src="" alt="" />
      </div>
      <div class="lightbox-details">
        <span id="lightbox-category" class="tag"></span>
        <h4 id="lightbox-title"></h4>
        <p id="lightbox-caption"></p>
      </div>
    </div>
  </div>

  <script src="/js/particles.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
